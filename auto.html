<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赤舟 · 爆款改写器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --card-2:#f8f9fb;
    --ink:#1c1f24; --ink-2:#68707d; --line:#e6e8ec;
    --accent:#c74a52; --accent-deep:#ad3941; --accent-soft:#fbeff0;
    --ok:#2f8f5b;
    --sans:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  [data-theme="dark"]{
    --bg:#14161a; --card:#1c1f24; --card-2:#23272f;
    --ink:#e6e8ec; --ink-2:#9aa3b0; --line:#2c3038;
    --accent:#e05b63; --accent-deep:#c74a52; --accent-soft:#3a2224;
    --ok:#4fb37a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
  header{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:16px 28px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:9;
  }
  header h1{font-size:17px;margin:0;font-weight:600;color:var(--ink)}
  header .sub{font-size:12.5px;color:var(--ink-2)}
  nav{display:flex;gap:6px;margin-left:auto}
  nav button{
    background:var(--card);border:1px solid var(--line);color:var(--ink-2);
    padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;
  }
  nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  nav button:hover{border-color:var(--ink-2)}
  main{max-width:880px;margin:24px auto;padding:0 18px 60px}
  section{display:none}
  section.on{display:block}

  .guide{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 22px;margin-bottom:16px;
  }
  .guide h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--ink)}
  .guide ol{margin:0;padding-left:22px;font-size:14px;line-height:2;color:var(--ink-2)}
  .guide b{color:var(--ink)}
  .guide .link{color:var(--accent);cursor:pointer}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:22px 24px;margin-bottom:16px;
  }
  .modebar{font-size:12.5px;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .badge{background:#eef0f3;color:var(--ink-2);border-radius:5px;padding:2px 9px;font-size:12px}
  .badge.rewrite{background:var(--accent-soft);color:var(--accent)}

  textarea{
    width:100%;font:15px/1.8 var(--sans);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;min-height:104px;resize:vertical;background:var(--card);
    color:var(--ink);transition:border .15s;
  }
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(199,74,82,.10)}

  .btn{
    background:var(--accent);color:#fff;border:0;border-radius:9px;
    padding:11px 26px;font-size:15px;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.sm{padding:4px 12px;font-size:12px;border-radius:7px}
  .spin{color:var(--ink-2);font-size:13px;margin-left:12px}

  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 2px}
  .scard{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;
    background:var(--card);transition:.15s;user-select:none;
  }
  .scard:hover{border-color:var(--ink-2)}
  .scard.sel{border-color:var(--accent);background:var(--accent-soft)}
  .scard .sname{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .scard.sel .sname{color:var(--accent-deep)}
  .scard .sdesc{font-size:12px;color:var(--ink-2)}

  .distill{display:inline-block;background:#f5e9cc;color:#8a6420;border:1px solid #e8d5a0;border-radius:4px;padding:0 6px;font-size:11px;font-weight:500;margin-left:6px;vertical-align:1px}
  [data-theme="dark"] .distill{background:#3a2f1a;color:#d9b56a;border-color:#5a4a26}


  .lbl{font-size:12px;color:var(--ink-2);margin:0}

  .vcard{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px 24px;margin-bottom:16px;
  }
  .vcard .tag{background:var(--accent);color:#fff;border-radius:5px;padding:3px 11px;font-size:12.5px}
  .vcard .sdesc{font-size:12px;color:var(--ink-2);margin-left:8px}
  .vcard .t{font-size:17px;font-weight:600;margin:12px 0 4px;color:var(--ink)}
  .copybox{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;white-space:pre-wrap;line-height:2;font-size:15px;margin:8px 0;color:var(--ink)}
  .meta{font-size:12px;color:var(--ink-2);margin-top:6px}
  .ok{color:var(--ok)} .bad{color:var(--accent)}
  .chips{margin:8px 0 16px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 13px;font-size:12.5px;cursor:pointer;margin:0 6px 6px 0;color:var(--ink-2);transition:.15s}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip:hover{border-color:var(--ink-2)}
  .board-title{font-size:15px;font-weight:600;margin:18px 0 8px;color:var(--ink)}
  .ref{border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;background:var(--card);display:flex;align-items:center;gap:10px;flex-wrap:wrap;transition:.15s}
  .ref:hover{border-color:var(--ink-2)}
  .ref .n{color:var(--accent);font-weight:600;flex:none;font-size:13px}
  .ref .ttl{flex:1;min-width:180px;font-size:14px}
  .ref .lbl{color:var(--ink-2)}
  .ref a{color:var(--accent);text-decoration:none;font-size:12px;flex:none}
  .err{background:#fdecec;border:1px solid #f3c2c2;color:#8a1c22;padding:14px;border-radius:10px;font-size:13px;white-space:pre-wrap}
  @media(max-width:680px){.sgrid{grid-template-columns:1fr}nav{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>赤舟 · 爆款改写器</h1>
  <span class="sub">贴素材 · 勾写法 · 二十秒出稿</span>
  <nav>
    <button data-s="gen" class="on">写文案</button>
    <button data-s="radar">爆款库</button>
    <button id="themeBtn" title="切换深色/浅色" style="padding:6px 10px">🌙</button>
  </nav>
</header>

<main>
<section id="gen" class="on">
  <div class="guide">
    <h3>三步出稿</h3>
    <ol>
      <li><b>贴素材</b>：家长原话、一个选题、一句话都行。没有就点「试个例子」，或去 <span class="link" onclick="goRadar()">爆款库</span> 挑一条</li>
      <li><b>勾写法</b>：点卡片选，要几种点几种</li>
      <li><b>点「生成」</b>，约 20 秒出结果，挑一版复制去发</li>
    </ol>
  </div>

  <div class="card">
    <div class="modebar">当前模式：<span class="badge" id="modeBadge">原创 · 手打素材</span></div>
    <textarea id="topic" placeholder="贴素材。例：家长说给孩子报了一年两万的英语班，成绩没变化。"></textarea>
    <p style="margin:10px 0 0"><button class="btn ghost sm" id="example">试个例子</button></p>

    <p class="lbl" style="margin:16px 0 4px">要哪几种写法（点卡片选）：</p>
    <div class="sgrid" id="styles"></div>

    <p style="margin:18px 0 0">
      <button class="btn" id="run">生成</button>
      <span class="spin" id="spin"></span>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-left:16px;cursor:pointer">
        <input type="checkbox" id="review" checked> K3 通顺审核
      </label>
    </p>
    <p class="lbl" style="margin-top:10px">选得越少越快。开了 K3 审核会再多花几十秒，但句子更通顺。</p>
  </div>

  <div id="err" style="display:none"></div>
  <div id="out"></div>
</section>

<section id="radar">
  <div class="card">
    <h2 class="board-title" style="margin-top:0">加素材</h2>
    <p class="lbl" style="margin:0 0 10px">看到好笔记，把链接和标题贴进来，自动打标签进库。（小红书链接抓不到标题，标题必填）</p>
    <input id="addUrl" placeholder="小红书链接（可留空）"
      style="width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--card);color:var(--ink);margin-bottom:8px">
    <input id="addTitle" placeholder="标题（必填，从小红书复制）"
      style="width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--card);color:var(--ink);margin-bottom:8px">
    <input id="addLikes" placeholder="点赞数（可留空）" inputmode="numeric"
      style="width:120px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--card);color:var(--ink);margin-bottom:8px">
    <p style="margin:6px 0 0">
      <button class="btn" id="addBtn">加进素材库</button>
      <span class="spin" id="addMsg"></span>
    </p>
  </div>
  <div class="card">
    <h2 class="board-title" style="margin-top:0">爆款库</h2>
    <p class="lbl" style="margin:0 0 10px">同赛道真爆款。点标题 = 照着它的骨架改写（不是抄）。「看原文」打开原笔记对照。</p>
    <div class="chips" id="themeChips"></div>
    <div id="radarOut"></div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const mdBold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const STYLE_INFO={
  "干货型":"⭐ 易出爆款 · 给一套能照着做的方法",
  "故事型":"讲一个学生的真实转变，靠共鸣",
  "分析型":"三问式剖析现象/学校/政策，给足数据",
  "立场型":"说句家长不爱听的，直接点破",
  "反讽型":"把槽点尖刻地拆穿",
  "共情型":"先安抚再讲道理",
  "短打型":"60秒口播稿，发视频号",
};
const STYLE_BADGE={
  "分析型":"nikkie妈蒸馏版",
  "立场型":"nikkie妈蒸馏版",
};
const EXAMPLE="家长说给孩子报了一年两万的英语班，成绩没变化，怀疑被割了韭菜";
let curTheme="全部", LIB=[], mode="原创";
const selected=new Set(["干货型"]);

function goRadar(){document.querySelector('nav button[data-s="radar"]').click();}
function setMode(m){
  mode=m;
  const b=$("modeBadge");
  if(m==="改写"){b.textContent="改写 · 照爆款骨架重写";b.className="badge rewrite";}
  else{b.textContent="原创 · 手打素材";b.className="badge";}
}
document.querySelectorAll("nav button[data-s]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button[data-s]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.querySelectorAll("section").forEach(s=>s.classList.remove("on"));
  document.getElementById(b.dataset.s).classList.add("on");
});

// 深色模式
(function(){
  const root=document.documentElement;
  const btn=$("themeBtn");
  root.dataset.theme = localStorage.getItem("theme") || "light";
  const paint = ()=>{ btn.textContent = root.dataset.theme === "dark" ? "☀️" : "🌙"; };
  paint();
  btn.onclick = ()=>{
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("theme", root.dataset.theme);
    paint();
  };
})();

// 写法卡片
(function(){
  const box=$("styles");
  Object.entries(STYLE_INFO).forEach(([s,desc])=>{
    const d=document.createElement("div");
    d.className="scard"+(selected.has(s)?" sel":"");
    const b=STYLE_BADGE[s]?`<span class="distill">${STYLE_BADGE[s]}</span>`:"";
    d.innerHTML=`<div class="sname">${s} ${b}</div><div class="sdesc">${desc}</div>`;
    d.onclick=()=>{selected.has(s)?selected.delete(s):selected.add(s);d.classList.toggle("sel");};
    box.appendChild(d);
  });
})();

$("example").onclick=()=>{$("topic").value=EXAMPLE;setMode("原创");};
$("topic").oninput=()=>setMode("原创");

function code(){return localStorage.getItem("xhs_code")||""}
async function apiFetch(url,opts){
  opts=opts||{};
  opts.headers=Object.assign({},opts.headers||{},{"X-Access-Code":code()});
  let r=await fetch(url,opts);
  if(r.status===401){
    const c=prompt("请输入访问码");
    if(c){localStorage.setItem("xhs_code",c);opts.headers["X-Access-Code"]=c;r=await fetch(url,opts);}
  }
  return r;
}

$("run").onclick=async()=>{
  const topic=$("topic").value.trim();
  if(!topic){alert("先贴素材，或点「试个例子」");return}
  const styles=[...selected];
  if(!styles.length){alert("至少点选一种写法");return}
  $("run").disabled=true;$("spin").textContent="正在写…约 20 秒，别关页面";
  $("err").style.display="none";$("out").innerHTML="";
  try{
    const r=await apiFetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({素材:topic,模式:mode,写法:styles,审核:$("review").checked})});
    const d=await r.json();
    if(!r.ok||d.error){showErr(d.error||"出错");return}
    render(d);
  }catch(e){showErr("连接失败或超时。云端首次访问要约 30 秒唤醒，开着 K3 审核出稿约 1 分钟——请稍等一下再刷新重试。本地使用请确认已双击「启动.bat」。");}
  finally{$("run").disabled=false;$("spin").textContent="";}
};
function showErr(m){$("err").style.display="block";$("err").innerHTML=`<div class="err">${esc(m)}</div>`;}

function cpBtn(txt){const id="c"+Math.random().toString(36).slice(2);
  setTimeout(()=>{const b=$(id);if(b)b.onclick=async()=>{await navigator.clipboard.writeText(txt);b.textContent="已复制";setTimeout(()=>b.textContent="复制",1100);};},0);
  return `<button class="btn ghost sm" id="${id}">复制</button>`;}

function render(d){
  const versions=d.versions||{}, qc=d.质检||{};
  const reviewed=d.已审核?'<span class="ok"> · K3 已审核</span>':'';
  let h=`<div class="card"><h2 class="board-title" style="margin-top:0">出稿了，挑一版复制去发${reviewed}</h2><p class="lbl">几版语气不同、骨架一样。绿勾=可直接用。</p></div>`;
  for(const k of Object.keys(STYLE_INFO)){
    const v=versions[k];
    if(!v)continue;
    const q=qc[k]||{};
    const dot=q.像真人?'<span class="ok">✓ 可用</span>':'<span class="bad">建议改改</span>';
    const bdg=STYLE_BADGE[k]?`<span class="distill">${STYLE_BADGE[k]}</span>`:"";
    h+=`<div class="vcard"><span class="tag">${esc(k)}</span>${bdg}<span class="sdesc">${STYLE_INFO[k]}</span> ${cpBtn(v.正文||"")}
      <div class="t">${esc(v.标题||"")}</div>`;
    if(v.封面大字)h+=`<div class="copybox" style="font-weight:600;font-size:16px">${esc(v.封面大字)}</div>`;
    h+=`<div class="copybox">${mdBold(v.正文||"")}</div>`;
    if(v.标签)h+=`<p class="lbl">${esc(v.标签)}</p>`;
    if(v.配图剪辑)h+=`<div class="copybox" style="border-left:3px solid var(--accent);font-size:13px;color:var(--ink-2)">🎬 配图/剪辑：${esc(v.配图剪辑)}</div>`;
    h+=`<p class="meta">${dot} · ${q.字数||0}字</p></div>`;
  }
  if(!Object.keys(versions).length)h=`<div class="card"><p class="lbl">没有生成内容。</p></div>`;
  $("out").innerHTML=h;
  $("out").scrollIntoView({behavior:"smooth"});
}

// 雷达
const THEMES=["全部","手动","自然拼读","单词记忆","语法","阅读","考试备考","启蒙方法","长沙本地","其他"];
function fmt(n){return n>=10000?(n/10000).toFixed(1)+"万":n}
function renderChips(){
  const box=$("themeChips");box.innerHTML="";
  THEMES.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t===curTheme?" on":"");b.textContent=t;
    b.onclick=()=>{curTheme=t;renderChips();renderRadar();};box.appendChild(b);});
}
function renderRadar(){
  const box=$("radarOut");box.innerHTML="";
  const byBoard={};
  LIB.forEach(it=>{
    if(curTheme==="手动"){ if(!it.manual) return; }
    else if(curTheme!=="全部"&&(it.theme||"其他")!==curTheme) return;
    (byBoard[it.board||"综合"]=byBoard[it.board||"综合"]||[]).push(it);
  });
  if(!Object.keys(byBoard).length){box.innerHTML=`<p class="lbl">这个筛选下没有内容。</p>`;return}
  for(const board in byBoard){
    const h=document.createElement("div");h.className="board-title";h.textContent=`${board}（${byBoard[board].length}）`;box.appendChild(h);
    byBoard[board].forEach(it=>{
      const d=document.createElement("div");d.className="ref";
      d.innerHTML=`<span class="n">${fmt(it.likes||0)}赞</span>${it.manual?'<span class="lbl" style="color:var(--accent)">手动</span>':''}<span class="ttl">${esc(it.title)}</span><span class="lbl">改写这篇</span>`;
      const a=document.createElement("a");
      if(it.url){a.href=it.url;a.target="_blank";a.textContent="看原文 ↗";}
      d.appendChild(a);
      d.onclick=(e)=>{if(e.target.tagName==="A")return;
        setMode("改写");$("topic").value=it.title;
        document.querySelector('nav button[data-s="gen"]').click();
      };
      box.appendChild(d);
    });
  }
}
(async()=>{
  renderChips();
  try{const r=await apiFetch("/library.json",{cache:"no-store"});if(r.ok)LIB=await r.json();}catch(e){}
  renderRadar();
})();

// 手动加素材
$("addBtn").onclick = async ()=>{
  const url=$("addUrl").value.trim(), title=$("addTitle").value.trim(), likes=$("addLikes").value.trim();
  if(!title){ alert("标题必填（小红书链接抓不到标题，请把标题也贴上）"); return; }
  $("addBtn").disabled=true; $("addMsg").textContent="正在加…";
  try{
    const r=await apiFetch("/api/add",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url,title,likes})});
    const d=await r.json();
    if(!r.ok||d.error){ $("addMsg").textContent="失败："+(d.error||"未知"); return; }
    $("addMsg").textContent = d.added ? "✓ 已加入素材库" : "这条已经在库里了";
    $("addUrl").value=""; $("addTitle").value=""; $("addLikes").value="";
    const r2=await apiFetch("/library.json",{cache:"no-store"});
    if(r2.ok){ LIB=await r2.json(); renderRadar(); }
  }catch(e){ $("addMsg").textContent="连接失败，稍等刷新重试"; }
  finally{ $("addBtn").disabled=false; }
};
</script>
</body>
</html>
