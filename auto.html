<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赤舟 · 爆款改写器</title>
<style>
  :root{--red:#a8232a;--red-soft:#f7ecec;--ink:#1d1d1f;--gray:#6b6b70;--line:#e5e3e0;--bg:#faf9f7;--ok:#2f7d4f;--warn:#b07a12}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:2px solid var(--red);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:9}
  header h1{font-size:16px;margin:0}
  header .sub{font-size:12px;color:var(--gray)}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{border:1px solid var(--line);background:#fff;padding:5px 14px;border-radius:14px;font-size:13px;cursor:pointer;color:var(--gray)}
  nav button.on{background:var(--red);color:#fff;border-color:var(--red)}
  main{max-width:920px;margin:0 auto;padding:22px}
  section{display:none}
  section.on{display:block}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:110px;resize:vertical;line-height:1.75}
  .btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:11px 22px;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
  .ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
  .chk{display:inline-flex;align-items:center;gap:5px;margin:4px 12px 4px 0;font-size:14px;cursor:pointer}
  .chk input{width:auto}
  .spin{color:var(--gray);font-size:13px;margin-left:10px}
  .vcard{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff}
  .vcard .tag{background:var(--red);color:#fff;border-radius:5px;padding:2px 10px;font-size:12px}
  .vcard .t{font-size:16px;font-weight:700;margin:8px 0}
  .copybox{background:#fbfaf8;border-radius:8px;padding:14px;white-space:pre-wrap;line-height:1.9;font-size:14px;margin:6px 0}
  .lbl{font-size:12px;color:var(--gray);margin:0}
  .meta{font-size:12px;color:var(--gray);margin-top:6px}
  .ok{color:var(--ok)} .bad{color:var(--red)} .mid{color:var(--warn)}
  .chips{margin:6px 0 14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 11px;font-size:12.5px;cursor:pointer;margin:0 5px 6px 0;color:var(--gray)}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red)}
  .ref{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;background:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ref:hover{border-color:var(--red)}
  .ref .n{color:var(--red);font-weight:600;flex:none}
  .ref .ttl{flex:1;min-width:200px}
  .ref a{color:var(--red);text-decoration:none;font-size:12px;flex:none}
  .board-title{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #eee;padding-bottom:4px}
  .err{background:#fdecec;border:1px solid #f3c2c2;color:#8a1c22;padding:12px;border-radius:8px;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>赤舟 · 爆款改写器</h1>
  <span class="sub">贴素材 → 选写法 → 一次出多版</span>
  <nav>
    <button data-s="gen" class="on">生成</button>
    <button data-s="radar">爆款雷达</button>
  </nav>
</header>

<main>
<section id="gen" class="on">
  <div class="card">
    <textarea id="topic" placeholder="贴素材：家长的原话、一个选题、一句话都行。也可以去「爆款雷达」点一条自动填进来。"></textarea>
    <div style="margin:12px 0 4px"><span class="lbl">这次要哪几种写法：</span></div>
    <div id="styles"></div>
    <p style="margin:12px 0 0">
      <button class="btn" id="run">生成</button>
      <span class="spin" id="spin"></span>
    </p>
    <p class="lbl" style="margin-top:8px">一次约 1-3 分钟，勾得越少越快。</p>
  </div>
  <div id="err" style="display:none"></div>
  <div id="out"></div>
</section>

<section id="radar">
  <div class="card">
    <h2 style="font-size:15px;margin:0 0 4px">爆款雷达</h2>
    <p class="lbl" style="margin:0 0 10px">每天自动更新。点标题填进生成框（改写模式），点「看原文」打开原笔记。</p>
    <div class="chips" id="themeChips"></div>
    <div id="radarOut"></div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const STYLES=["立场型","反讽型","共情型","短打型","干货型"];
let curTheme="全部", LIB=[], mode="原创";

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.querySelectorAll("section").forEach(s=>s.classList.remove("on"));
  document.getElementById(b.dataset.s).classList.add("on");
});

// 写法勾选
(function(){
  const box=$("styles");
  STYLES.forEach(s=>{
    const l=document.createElement("label");
    l.className="chk";
    l.innerHTML=`<input type="checkbox" value="${s}" checked> ${s}`;
    box.appendChild(l);
  });
})();

function code(){return localStorage.getItem("xhs_code")||""}
async function apiFetch(url,opts){
  opts=opts||{};
  opts.headers=Object.assign({},opts.headers||{},{"X-Access-Code":code()});
  let r=await fetch(url,opts);
  if(r.status===401){
    const c=prompt("请输入访问码");
    if(c){localStorage.setItem("xhs_code",c);opts.headers["X-Access-Code"]=c;r=await fetch(url,opts);}
  }
  return r;
}

// 生成
$("run").onclick=async()=>{
  const topic=$("topic").value.trim();
  if(!topic){alert("先贴素材");return}
  const styles=[...document.querySelectorAll("#styles input:checked")].map(i=>i.value);
  if(!styles.length){alert("至少勾一种写法");return}
  $("run").disabled=true;$("spin").textContent="正在写…约 1-3 分钟，别关页面";
  $("err").style.display="none";$("out").innerHTML="";
  try{
    const r=await apiFetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({素材:topic,模式:mode,写法:styles})});
    const d=await r.json();
    if(!r.ok||d.error){showErr(d.error||"出错");return}
    render(d);
  }catch(e){showErr("连不上服务。确认已双击「启动.bat」。");}
  finally{$("run").disabled=false;$("spin").textContent="";}
};
function showErr(m){$("err").style.display="block";$("err").innerHTML=`<div class="err">${esc(m)}</div>`;}

function cpBtn(txt){const id="c"+Math.random().toString(36).slice(2);
  setTimeout(()=>{const b=$(id);if(b)b.onclick=async()=>{await navigator.clipboard.writeText(txt);b.textContent="已复制";setTimeout(()=>b.textContent="复制",1100);};},0);
  return `<button class="btn sm ghost" id="${id}">复制</button>`;}

function render(d){
  const versions=d.versions||{}, qc=d.质检||{};
  let h="";
  for(const k of STYLES){
    const v=versions[k];
    if(!v)continue;
    const q=qc[k]||{};
    let meta=`<span class="${q.像真人?'ok':'bad'}">像真人:${q.像真人?'是':'否'}</span> · 字数${q.字数} · 口语词${q.口语词}`;
    h+=`<div class="vcard"><span class="tag">${esc(k)}</span> ${cpBtn(v.正文||"")}
      <div class="t">${esc(v.标题||"")}</div>`;
    if(v.封面大字)h+=`<div class="copybox" style="font-size:15px;font-weight:600">${esc(v.封面大字)}</div>`;
    h+=`<div class="copybox">${esc(v.正文||"")}</div>`;
    if(v.标签)h+=`<p class="lbl">${esc(v.标签)}</p>`;
    h+=`<p class="meta">${meta}</p></div>`;
  }
  if(!h)h=`<div class="card"><p class="lbl">没有生成内容。</p></div>`;
  $("out").innerHTML=h;
}

// 雷达
const THEMES=["全部","单词记忆","自然拼读","语法","听力","口语","阅读·原版书","写作","KET·PET","启蒙方法","动画·儿歌","学习习惯","选课·选班","择校","政策","分班","学校","其他"];
function fmt(n){return n>=10000?(n/10000).toFixed(1)+"万":n}
function renderChips(){
  const box=$("themeChips");box.innerHTML="";
  THEMES.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t===curTheme?" on":"");b.textContent=t;
    b.onclick=()=>{curTheme=t;renderChips();renderRadar();};box.appendChild(b);});
}
function renderRadar(){
  const box=$("radarOut");box.innerHTML="";
  const byBoard={};
  LIB.forEach(it=>{if(curTheme!=="全部"&&(it.theme||"其他")!==curTheme)return;(byBoard[it.board||"综合"]=byBoard[it.board||"综合"]||[]).push(it);});
  if(!LIB.length){box.innerHTML=`<p class="lbl">素材库是空的，先双击「刷新素材.bat」抓一次。</p>`;return}
  for(const board in byBoard){
    const h=document.createElement("div");h.className="board-title";h.textContent=`${board}（${byBoard[board].length}）`;box.appendChild(h);
    byBoard[board].forEach(it=>{
      const d=document.createElement("div");d.className="ref";
      d.innerHTML=`<span class="n">${fmt(it.likes||0)}赞</span><span class="ttl">${esc(it.title)}</span>`;
      if(it.theme)d.insertAdjacentHTML("beforeend",`<span class="lbl">${esc(it.theme)}</span>`);
      const a=document.createElement("a");
      if(it.url){a.href=it.url;a.target="_blank";a.textContent="看原文 ↗";}
      d.appendChild(a);
      d.querySelector(".ttl").onclick=()=>{
        mode="改写";$("topic").value=it.title;
        document.querySelector('nav button[data-s="gen"]').click();
      };
      box.appendChild(d);
    });
  }
}
(async()=>{
  renderChips();
  try{const r=await apiFetch("/library.json",{cache:"no-store"});if(r.ok)LIB=await r.json();}catch(e){}
  renderRadar();
})();
</script>
</body>
</html>
